name: CI
on:
    push:
    pull_request:

permissions:
    contents: read
jobs:
    tests:
        runs-on: ubuntu-latest
        timeout-minutes: 15
    
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            
            - name: Set Up Go
              uses: actions/setup-go@v5
              with:
                go-version-file: go.mod
                cache: true
            
            - name: Download dependencies
              run: go mod download
            
            - name: Vet
              run: go vet ./...
            
            - name: Test
              run: go test ./...
            
            - name: Race Test
              run: go test -race ./...